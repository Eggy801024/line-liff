<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>店家訂單後台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="admin-shell">
      <section class="login-panel" id="loginPanel">
        <h1>店家後台登入</h1>
        <label class="field">
          <span>後台密碼</span>
          <input id="adminPasswordInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="請輸入後台密碼">
        </label>
        <button type="button" class="submit-btn" id="loginButton">登入</button>
        <p class="result" id="loginResult"></p>
      </section>

      <section id="adminContent" hidden>
        <header class="admin-header">
          <div>
            <h1>訂單管理</h1>
            <p>接單、出單、完成訂單</p>
          </div>
          <div class="admin-actions">
            <button type="button" id="getShopLineIdTop">取得 LINE ID</button>
            <button type="button" id="printTest">出單測試</button>
            <button type="button" id="logoutButton">登出</button>
            <a href="/">前台</a>
          </div>
        </header>

        <nav class="tabs" id="tabs">
          <button type="button" data-tab="active" class="active">進行中</button>
          <button type="button" data-tab="new">待接單</button>
          <button type="button" data-tab="done">已完成</button>
        </nav>

        <section class="stats">
          <article>
            <span>今日訂單</span>
            <strong id="todayCount">0</strong>
          </article>
          <article>
            <span>今日營收</span>
            <strong id="todayRevenue">$0</strong>
          </article>
          <article>
            <span>待處理</span>
            <strong id="pendingCount">0</strong>
          </article>
        </section>

        <section id="orders" class="orders"></section>

        <section class="settings-panel">
          <header class="settings-header">
            <h2>後台設定</h2>
            <div class="settings-actions">
              <button type="button" id="clearOrderHistory" class="danger-btn">清空歷史訂單</button>
              <button type="button" id="saveSettings">儲存設定</button>
            </div>
          </header>
          <div class="settings-grid">
            <label class="field">
              <span>店名</span>
              <input id="shopName">
            </label>
            <label class="field">
              <span>公休日</span>
              <textarea id="closedDates" placeholder="可輸入 6/18、7/1，也可輸入 2026-06-18"></textarea>
            </label>
            <label class="field">
              <span>修改後台密碼</span>
              <input id="newAdminPassword" type="password" autocomplete="new-password" placeholder="留空代表不更改">
            </label>
            <label class="field shop-line-id-field">
              <span>店家 LINE 通知 ID</span>
              <div class="inline-tool">
                <input id="shopLineUserId" readonly placeholder="按右側按鈕取得">
                <button type="button" id="getShopLineId">取得</button>
              </div>
            </label>
          </div>

          <h2>品項與價格</h2>
          <div id="menuEditor" class="editor-list"></div>

          <h2>付款方式</h2>
          <div id="paymentEditor" class="editor-list"></div>
          <p class="result" id="settingsResult"></p>
        </section>
      </section>
    </main>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
