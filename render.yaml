services:
  - type: web
    name: line-self-ordering-system
    env: node
    buildCommand: ""
    startCommand: "node src/server.js"
    envVars:
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LIFF_ID
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: SHOP_NOTIFY_LINE_USER_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_ORDER_SHEET_NAME
        value: Orders
